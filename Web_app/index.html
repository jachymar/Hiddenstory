<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hidden Story</title>
    <style>
        :root {
            --bg-color: #141b38;
            --panel-bg: #1e2130;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-orange: #f59e0b;
            --accent-orange-hover: #d97706;
            --status-red: #ef4444;
            --status-green: #10b981;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header h1 strong {
            font-weight: 700;
            color: var(--accent-orange);
        }

        /* STATUS BADGE */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--status-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.3s ease;
        }

        .status-indicator.connected {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--status-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* GRID LAYOUT */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: repeat(2, 1fr);
            }
            .span-full {
                grid-column: 1 / -1;
            }
        }

        /* CONFIG MODULE */
        .config-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .config-panel label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .config-panel input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .config-panel input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* CARDS */
        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 1.2rem;
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* BUTTONS */
        button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            margin-bottom: 0.75rem;
        }

        button:last-child {
            margin-bottom: 0;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background-color: var(--accent-blue);
        }

        .btn-primary:hover {
            background-color: var(--accent-blue-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .btn-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .btn-warning:hover {
            background-color: rgba(245, 158, 11, 0.25);
        }

        /* SUB-GRID FOR BUTTONS */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-grid button {
            margin-bottom: 0;
        }

        /* TERMINAL / DIAGNOSTICS */
        .system-health {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            background: #0f1322;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .health-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            padding: 0.3rem;
            border-radius: 4px;
            background: rgba(255,255,255,0.02);
        }

        .health-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--status-red);
            flex-shrink: 0;
            box-shadow: 0 0 5px rgba(239, 68, 68, 0.4);
        }

        .health-item.ok .health-dot {
            background-color: var(--status-green);
            box-shadow: 0 0 5px rgba(16, 185, 129, 0.4);
        }

        .health-item.ok {
            color: var(--text-main);
        }

        .terminal-container {
            background-color: #050505;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            height: 250px;
            overflow-y: auto;
        }

        .terminal-container pre {
            margin: 0;
            color: #22c55e;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* FOOTER & DEV LINK */
        .footer {
            margin-top: 2rem;
            text-align: right;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .dev-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s, color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        .dev-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <header class="header">
            <div style="display: flex; flex-direction: column;">
                <h1>Hidden Story <strong>Operator</strong></h1>
                <button id="btnConnectUsb" class="btn-outline" style="font-size: 0.75rem; padding: 0.3rem 0.6rem; width: auto; margin-top: 0.5rem; align-self: flex-start;" onclick="connectUsb()">Připojit přes USB (Web Serial)</button>
            </div>
            <div id="statusBadge" class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText">Odpojeno</span>
            </div>
        </header>

        <div class="grid-layout">
            
            <!-- GAME MODES MODULE -->
            <div class="card">
                <h2>Herní Módy</h2>
                <button class="btn-outline" onclick="sendCommand('0')">Standardní Hra</button>
                <button class="btn-outline" onclick="sendCommand('3')">Pracovní Mód</button>
            </div>

            <!-- LOCKS MODULE -->
            <div class="card">
                <h2>Manuální Ovládání</h2>
                <div class="btn-grid">
                    <button class="btn-warning" onclick="sendCommand('A')">Lebka</button>
                    <button class="btn-warning" onclick="sendCommand('B')">Tlačítka</button>
                    <button class="btn-warning" onclick="sendCommand('C')">Kola</button>
                    <button class="btn-warning" onclick="sendCommand('E')">Oltář (Ťukání)</button>
                </div>
            </div>

            <!-- DIAGNOSTICS MODULE (HIDDEN) -->
            <div class="card span-full" id="diagPanel" style="display: none;">
                <h2>Systémová Diagnostika</h2>
                <div style="margin-bottom: 0.75rem; display: flex; gap: 0.5rem; align-items: center;">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">IP ESP32:</label>
                    <input type="text" id="ipAddress" value="192.168.0.100" style="background: #111; border: 1px solid #333; color: #fff; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.85rem;">
                </div>

                <h3 style="font-size: 0.85rem; color: var(--text-muted); margin: 0 0 0.5rem 0; text-transform: uppercase;">Stav Komponent</h3>
                <div class="system-health" id="systemHealth">
                    <div class="health-item" id="h-laser"><div class="health-dot"></div>Laser (13)</div>
                    <div class="health-item" id="h-tlac"><div class="health-dot"></div>Tlačítka (11)</div>
                    <div class="health-item" id="h-lebka"><div class="health-dot"></div>Lebka (15)</div>
                    <div class="health-item" id="h-kola"><div class="health-dot"></div>Kola (12)</div>
                    <div class="health-item" id="h-svetla"><div class="health-dot"></div>Světla (14)</div>
                    <div class="health-item" id="h-m3"><div class="health-dot"></div>ESP M3 (WiFi)</div>
                    <div class="health-item" id="h-tukani"><div class="health-dot"></div>Ťukání (20)</div>
                    <div class="health-item" id="h-audio3"><div class="health-dot"></div>Audio3 (21)</div>
                    <div class="health-item" id="h-lcd"><div class="health-dot"></div>LCD (0x27)</div>
                </div>

                <div style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Vyberte modul pro detailní diagnostiku:</label>
                    <select id="moduleSelect" onchange="selectModule(this.value)" style="width:100%; padding:0.5rem; background:#111; color:#fff; border:1px solid #333; border-radius:4px; margin-top:0.5rem; font-size:0.9rem;">
                        <option value="0">-- Žádný (Vypnuto) --</option>
                        <option value="1">Modul 1: Lebka</option>
                        <option value="2">Modul 2: Světla</option>
                        <option value="3">Modul 3: Tlačítka</option>
                        <option value="4">Modul 4: Kola (Analogy)</option>
                        <option value="5">Modul 5: Laser</option>
                        <option value="6">Místnost 3: ESP32 (Ťukání + Audio)</option>
                    </select>
                </div>
                
                <!-- TLAČÍTKA PRO KONKRÉTNÍ MODUL A NÁSTROJE -->
                <div id="moduleActions" style="display: none; gap: 0.5rem; margin-bottom: 1rem;">
                    <button class="btn-outline" style="font-size: 0.8rem; padding: 0.5rem; flex: 1;" onclick="setDiagMode('sensors')">Hodnoty senzorů</button>
                    <button class="btn-outline" style="font-size: 0.8rem; padding: 0.5rem; flex: 1;" onclick="setDiagMode('logs')">Serial log</button>
                </div>

                <div style="margin-bottom: 1rem;">
                    <button class="btn-warning" style="font-size: 0.8rem; padding: 0.5rem;" onclick="sendCommand('I')">Spustit I2C Skener (Test Sběrnice)</button>
                </div>

                <div class="terminal-container" style="display:flex; flex-direction:column; height: 350px;">
                    <div id="diagStatus" style="flex: 1; overflow-y: auto; padding-bottom: 0.5rem; margin-bottom: 0.5rem; white-space: pre-wrap; color: #38bdf8; font-family: 'Consolas', monospace; font-size: 0.85rem;">
                        Vyberte modul pro diagnostiku...
                    </div>
                    <div id="diagTerminal" style="display: none; flex: 1; overflow-y: auto; color: #22c55e; font-family: 'Consolas', monospace; font-size: 0.85rem;">
                        <div style="color: #666;">--- Historie Logů ---</div>
                    </div>
                </div>
            </div>

        </div>

        <footer class="footer">
            <span class="dev-link" onclick="toggleDevMode()">System Config</span>
        </footer>

    </div>

    <script>
        const DEFAULT_IP = '192.168.0.100';
        let devMode = false;
        let isConnected = false;
        let lastLogMessage = "";
        let currentDiagMode = 'sensors';

        // --- PROMĚNNÉ PRO USB SERIAL ---
        let serialPort = null;
        let serialWriter = null;
        let serialReader = null;

        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const diagPanel = document.getElementById('diagPanel');
        const diagStatus = document.getElementById('diagStatus');
        const diagTerminal = document.getElementById('diagTerminal');
        const devLink = document.querySelector('.dev-link');
        const ipInput = document.getElementById('ipAddress');

        // Reset staré IP (192.168.1.100) na novou podsíť
        let savedIp = localStorage.getItem('esp_master_ip');
        if (!savedIp || savedIp.includes('192.168.1.')) {
            savedIp = DEFAULT_IP;
            localStorage.setItem('esp_master_ip', DEFAULT_IP);
        }
        ipInput.value = savedIp;

        ipInput.addEventListener('change', () => {
            const cleanIp = ipInput.value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            ipInput.value = cleanIp || DEFAULT_IP;
            localStorage.setItem('esp_master_ip', ipInput.value);
            scheduleNextPoll(100);
        });

        function getBaseUrl() {
            let ip = (ipInput.value.trim() || DEFAULT_IP);
            if (!ip.startsWith('http://') && !ip.startsWith('https://')) {
                ip = 'http://' + ip;
            }
            return ip;
        }

        // --- ROBUSTNÍ SÍŤOVÝ SPRÁVCE (Garantuje max. 1 aktivní požadavek na ENC28J60) ---
        let isNetworkBusy = false;
        let pollTimer = null;
        let failedCount = 0;
        const MAX_FAILS_BEFORE_OFFLINE = 3;
        const NORMAL_POLL_INTERVAL = 1200; // ms
        const RETRY_POLL_INTERVAL = 1800;  // ms

        function setConnectionState(state, modeText = '') {
            if (state === 'connected') {
                isConnected = true;
                statusText.textContent = modeText || (serialPort ? 'Připojeno (USB)' : 'Připojeno (LAN)');
                statusBadge.className = 'status-indicator connected';
            } else if (state === 'connecting') {
                statusText.textContent = 'Připojování...';
                statusBadge.className = 'status-indicator';
                statusBadge.style.color = 'var(--accent-orange)';
                statusBadge.style.borderColor = 'rgba(245, 158, 11, 0.3)';
                statusBadge.style.backgroundColor = 'rgba(245, 158, 11, 0.1)';
            } else {
                isConnected = false;
                statusText.textContent = 'Odpojeno';
                statusBadge.className = 'status-indicator';
                statusBadge.style.color = '';
                statusBadge.style.borderColor = '';
                statusBadge.style.backgroundColor = '';
            }
        }

        function scheduleNextPoll(delayMs = NORMAL_POLL_INTERVAL) {
            if (pollTimer) {
                clearTimeout(pollTimer);
                pollTimer = null;
            }
            if (!serialPort) {
                pollTimer = setTimeout(fetchState, delayMs);
            }
        }

        function updateHealthDot(id, isOk) {
            const el = document.getElementById(id);
            if (el) {
                if (isOk) el.classList.add('ok');
                else el.classList.remove('ok');
            }
        }

        function handleTelemetryData(data) {
            setConnectionState('connected', serialPort ? 'Připojeno (USB)' : 'Připojeno (LAN)');

            if (devMode && data.online) {
                // Aktualizace panelu "Stav Komponent" na základě tvrdých True/False z I2C sběrnice
                updateHealthDot('h-laser', data.online.laser === 1);
                updateHealthDot('h-tlac', data.online.tlacitka === 1);
                updateHealthDot('h-lebka', data.online.lebka === 1);
                updateHealthDot('h-kola', data.online.kola === 1);
                updateHealthDot('h-svetla', data.online.svetla === 1);
                updateHealthDot('h-lcd', data.online.lcd === 1);
                
                // Místnost 3
                updateHealthDot('h-m3', data.online.m3 === 1);
                updateHealthDot('h-tukani', data.online.m3_tukani === 1);
                updateHealthDot('h-audio3', data.online.m3_audio3 === 1);

                if (data.diag_text) {
                    diagStatus.textContent = data.diag_text;
                    
                    if (data.diag_log && data.diag_log !== lastLogMessage && data.diag_log !== "Start" && data.diag_log !== "") {
                        lastLogMessage = data.diag_log;
                        const time = new Date().toLocaleTimeString('cs-CZ');
                        const logDiv = document.createElement('div');
                        logDiv.innerHTML = `<span style="color:#888">[${time}]</span> ${data.diag_log}`;
                        diagTerminal.appendChild(logDiv);
                        diagTerminal.scrollTop = diagTerminal.scrollHeight;
                    }
                } else {
                    diagStatus.textContent = JSON.stringify(data, null, 2);
                }
            }
        }

        async function connectUsb() {
            if (!('serial' in navigator)) {
                alert('Váš prohlížeč nepodporuje Web Serial API. Použijte Chrome, Edge nebo Operu.');
                return;
            }
            
            try {
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 115200 });
                
                serialWriter = serialPort.writable.getWriter();
                const textDecoder = new TextDecoderStream();
                serialPort.readable.pipeTo(textDecoder.writable);
                serialReader = textDecoder.readable.getReader();
                
                document.getElementById('btnConnectUsb').textContent = 'USB Připojeno (Odpojit restartem stránky)';
                document.getElementById('btnConnectUsb').style.color = 'var(--status-green)';
                document.getElementById('btnConnectUsb').style.borderColor = 'var(--status-green)';
                
                if (pollTimer) {
                    clearTimeout(pollTimer);
                    pollTimer = null;
                }

                readSerialLoop();
                sendCommand("GET_STATE"); // Okamžitá žádost o data po připojení
            } catch (err) {
                console.error('Chyba USB připojení:', err);
            }
        }

        async function readSerialLoop() {
            let buffer = "";
            try {
                while (true) {
                    const { value, done } = await serialReader.read();
                    if (done) break;
                    if (value) {
                        buffer += value;
                        let lines = buffer.split('\n');
                        buffer = lines.pop(); // Poslední nekompletní řádek si necháme na příště
                        
                        for (let line of lines) {
                            line = line.trim();
                            if (line.startsWith("TELEMETRY:")) {
                                try {
                                    handleTelemetryData(JSON.parse(line.substring(10)));
                                } catch(e) {}
                            } else if (devMode && currentDiagMode === 'logs' && line.length > 0 && !line.startsWith("{")) {
                                const time = new Date().toLocaleTimeString('cs-CZ');
                                const logDiv = document.createElement('div');
                                logDiv.innerHTML = `<span style="color:#f59e0b">[ESP]</span> <span style="color:#888">[${time}]</span> ${line}`;
                                diagTerminal.appendChild(logDiv);
                                diagTerminal.scrollTop = diagTerminal.scrollHeight;
                            }
                        }
                    }
                }
            } catch (e) {
                console.error("USB odpojeno", e);
                serialPort = null;
                setConnectionState('disconnected');
                document.getElementById('btnConnectUsb').textContent = 'Připojit přes USB (Web Serial)';
                document.getElementById('btnConnectUsb').style.color = '';
                document.getElementById('btnConnectUsb').style.borderColor = '';
                scheduleNextPoll(500);
            }
        }

        function setDiagMode(mode) {
            currentDiagMode = mode;
            if (mode === 'sensors') {
                diagStatus.style.display = 'block';
                diagTerminal.style.display = 'none';
            } else if (mode === 'logs') {
                diagStatus.style.display = 'none';
                diagTerminal.style.display = 'block';
            }
        }

        function selectModule(val) {
            if (val == 0) {
                document.getElementById('moduleActions').style.display = 'none';
            } else {
                document.getElementById('moduleActions').style.display = 'flex';
            }
            sendCommand('D' + val);
            diagStatus.textContent = "Vyžádání dat z modulu " + val + "...";
            diagTerminal.innerHTML = '<div style="color: #666;">--- Historie Logů Modulu ' + val + ' ---</div>';
            lastLogMessage = ""; // Reset history tracker on module change
        }

        async function fetchState() {
            if (serialPort) return;
            if (isNetworkBusy) {
                scheduleNextPoll(300);
                return;
            }

            const baseUrl = getBaseUrl();
            if (!baseUrl) {
                scheduleNextPoll(RETRY_POLL_INTERVAL);
                return;
            }

            isNetworkBusy = true;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);

            try {
                const response = await fetch(`${baseUrl}/api/state`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    failedCount = 0;
                    handleTelemetryData(data);
                    scheduleNextPoll(NORMAL_POLL_INTERVAL);
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                failedCount++;
                if (failedCount >= MAX_FAILS_BEFORE_OFFLINE) {
                    setConnectionState('disconnected');
                } else if (isConnected) {
                    setConnectionState('connecting');
                }
                scheduleNextPoll(RETRY_POLL_INTERVAL);
            } finally {
                isNetworkBusy = false;
            }
        }

        // Spuštění po načtení stránky
        scheduleNextPoll(100);

        function toggleDevMode() {
            if (!devMode) {
                let pwd = prompt("Zadejte přístupový kód (Developer Mode):");
                if (pwd === "1234") {
                    devMode = true;
                    diagPanel.style.display = 'block';
                    devLink.textContent = 'Disable System Config';
                    devLink.style.color = 'var(--status-green)';
                    devLink.style.opacity = '1';
                    document.getElementById('moduleSelect').value = "0";
                    sendCommand('X1');
                } else if (pwd !== null) {
                    alert("Nesprávný přístupový kód.");
                }
            } else {
                devMode = false;
                diagPanel.style.display = 'none';
                devLink.textContent = 'System Config';
                devLink.style.color = 'var(--text-muted)';
                devLink.style.opacity = '0.3';
                sendCommand('X0');
            }
        }

        async function sendCommand(cmd) {
            if (serialPort && serialWriter) {
                try {
                    const encoder = new TextEncoder();
                    await serialWriter.write(encoder.encode(cmd + '\n'));
                    console.log('USB Odesláno:', cmd);
                } catch (err) {
                    console.error('Chyba při odesílání přes USB:', err);
                }
                return;
            }

            const baseUrl = getBaseUrl();
            if (!baseUrl) {
                console.warn('Chybí IP adresa!');
                return;
            }

            // Zastavíme plánovaný polling po dobu odesílání příkazu
            if (pollTimer) {
                clearTimeout(pollTimer);
                pollTimer = null;
            }

            // Pokud právě dobíhá GET požadavek, krátce počkáme (max 200ms)
            let waitAttempts = 0;
            while (isNetworkBusy && waitAttempts < 4) {
                await new Promise(r => setTimeout(r, 50));
                waitAttempts++;
            }

            isNetworkBusy = true;
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 2000);

            try {
                const response = await fetch(`${baseUrl}/api/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: cmd,
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (response.ok) {
                    failedCount = 0;
                    setConnectionState('connected', 'Připojeno (LAN)');
                    console.log('Příkaz úspěšně doručen:', cmd);
                    // Okamžitá aktualizace stavu pro okamžitou odezvu v UI
                    scheduleNextPoll(100);
                } else {
                    console.warn(`Příkaz vrátil status: ${response.status}`);
                    scheduleNextPoll(500);
                }
            } catch (error) {
                console.error('Chyba při odesílání příkazu:', error);
                scheduleNextPoll(1000);
            } finally {
                isNetworkBusy = false;
            }
        }
    </script>
</body>
