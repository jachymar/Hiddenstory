<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hidden Story</title>
    <style>
        :root {
            --bg-color: #141b38;
            --panel-bg: #1e2130;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-orange: #f59e0b;
            --accent-orange-hover: #d97706;
            --status-red: #ef4444;
            --status-green: #10b981;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 2rem 1rem;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* HEADER */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 400;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header h1 strong {
            font-weight: 700;
            color: var(--accent-orange);
        }

        /* STATUS BADGE */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--status-red);
            border: 1px solid rgba(239, 68, 68, 0.2);
            transition: all 0.3s ease;
        }

        .status-indicator.connected {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--status-green);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* GRID LAYOUT */
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .grid-layout {
                grid-template-columns: repeat(2, 1fr);
            }
            .span-full {
                grid-column: 1 / -1;
            }
        }

        /* CONFIG MODULE */
        .config-panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .config-panel label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .config-panel input {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
        }

        .config-panel input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        /* CARDS */
        .card {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 1.2rem;
            font-size: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* BUTTONS */
        button {
            width: 100%;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            margin-bottom: 0.75rem;
        }

        button:last-child {
            margin-bottom: 0;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background-color: var(--accent-blue);
        }

        .btn-primary:hover {
            background-color: var(--accent-blue-hover);
        }

        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
        }

        .btn-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--accent-orange);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .btn-warning:hover {
            background-color: rgba(245, 158, 11, 0.25);
        }

        /* SUB-GRID FOR BUTTONS */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-grid button {
            margin-bottom: 0;
        }

        /* TERMINAL / DIAGNOSTICS */
        .terminal-container {
            background-color: #050505;
            border: 1px solid #222;
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1rem;
            height: 250px;
            overflow-y: auto;
        }

        .terminal-container pre {
            margin: 0;
            color: #22c55e;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* FOOTER & DEV LINK */
        .footer {
            margin-top: 2rem;
            text-align: right;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .dev-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s, color 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
        }

        .dev-link:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <header class="header">
            <h1>Hidden Story <strong>Operator</strong></h1>
            <div id="statusBadge" class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText">Odpojeno</span>
            </div>
        </header>

        <div class="grid-layout">
            
            <!-- GAME MODES MODULE -->
            <div class="card">
                <h2>Herní Módy</h2>
                <button class="btn-outline" onclick="sendCommand('0')">Standardní Hra</button>
                <button class="btn-outline" onclick="sendCommand('3')">Pracovní Mód</button>
            </div>

            <!-- LOCKS MODULE -->
            <div class="card">
                <h2>Manuální Ovládání</h2>
                <div class="btn-grid">
                    <button class="btn-warning" onclick="sendCommand('A')">Lebka</button>
                    <button class="btn-warning" onclick="sendCommand('B')">Tlačítka</button>
                    <button class="btn-warning" onclick="sendCommand('C')">Kola</button>
                    <button class="btn-warning" onclick="sendCommand('E')">Oltář (Ťukání)</button>
                </div>
            </div>

            <!-- DIAGNOSTICS MODULE (HIDDEN) -->
            <div class="card span-full" id="diagPanel" style="display: none;">
                <h2>Systémová Diagnostika</h2>
                <div style="margin-bottom: 0.75rem; display: flex; gap: 0.5rem; align-items: center;">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">IP ESP32:</label>
                    <input type="text" id="ipAddress" value="192.168.1.100" style="background: #111; border: 1px solid #333; color: #fff; padding: 0.3rem 0.5rem; border-radius: 4px; font-size: 0.85rem;">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="font-size: 0.8rem; color: var(--text-muted);">Vyberte modul pro diagnostiku:</label>
                    <select id="moduleSelect" onchange="selectModule(this.value)" style="width:100%; padding:0.5rem; background:#111; color:#fff; border:1px solid #333; border-radius:4px; margin-top:0.5rem; font-size:0.9rem;">
                        <option value="0">-- Žádný (Vypnuto) --</option>
                        <option value="1">Modul 1: Lebka</option>
                        <option value="2">Modul 2: Světla</option>
                        <option value="3">Modul 3: Tlačítka</option>
                        <option value="4">Modul 4: Kola (Analogy)</option>
                        <option value="5">Modul 5: Laser</option>
                        <option value="6">Místnost 3: ESP32 (Ťukání + Audio)</option>
                    </select>
                </div>
                <div class="terminal-container" style="display:flex; flex-direction:column; height: 350px;">
                    <div id="diagStatus" style="flex: 1; border-bottom: 1px solid #333; padding-bottom: 0.5rem; margin-bottom: 0.5rem; white-space: pre-wrap; color: #38bdf8; font-family: 'Consolas', monospace; font-size: 0.85rem;">
                        Inicializace diagnostického streamu...
                    </div>
                    <div id="diagTerminal" style="flex: 1; overflow-y: auto; color: #22c55e; font-family: 'Consolas', monospace; font-size: 0.85rem;">
                        <div style="color: #666;">--- Historie Logů ---</div>
                    </div>
                </div>
            </div>

        </div>

        <footer class="footer">
            <span class="dev-link" onclick="toggleDevMode()">System Config</span>
        </footer>

    </div>

    <script>
        const DEFAULT_IP = '192.168.0.100';
        let devMode = false;
        let isConnected = false;
        let lastLogMessage = "";

        const statusBadge = document.getElementById('statusBadge');
        const statusText = document.getElementById('statusText');
        const diagPanel = document.getElementById('diagPanel');
        const diagStatus = document.getElementById('diagStatus');
        const diagTerminal = document.getElementById('diagTerminal');
        const devLink = document.querySelector('.dev-link');
        const ipInput = document.getElementById('ipAddress');

        // Reset staré IP (192.168.1.100) na novou podsíť
        let savedIp = localStorage.getItem('esp_master_ip');
        if (!savedIp || savedIp.includes('192.168.1.')) {
            savedIp = DEFAULT_IP;
            localStorage.setItem('esp_master_ip', DEFAULT_IP);
        }
        ipInput.value = savedIp;

        ipInput.addEventListener('change', () => {
            localStorage.setItem('esp_master_ip', ipInput.value.trim());
        });

        function getBaseUrl() {
            let ip = (ipInput.value.trim() || DEFAULT_IP);
            if (!ip.startsWith('http')) {
                ip = 'http://' + ip;
            }
            return ip;
        }

        function selectModule(val) {
            sendCommand('D' + val);
            diagStatus.textContent = "Vyžádání dat z modulu " + val + "...";
            diagTerminal.innerHTML = '<div style="color: #666;">--- Historie Logů Modulu ' + val + ' ---</div>';
            lastLogMessage = ""; // Reset history tracker on module change
        }

        async function fetchState() {
            const baseUrl = getBaseUrl();
            if (!baseUrl) return;

            try {
                const response = await fetch(`${baseUrl}/api/state`, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    signal: AbortSignal.timeout(1500) // Timeout 1.5s
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (!isConnected) {
                        isConnected = true;
                        statusText.textContent = 'Připojeno';
                        statusBadge.classList.add('connected');
                    }

                    if (devMode) {
                        if (data.diag_text) {
                            diagStatus.textContent = data.diag_text;
                            
                            if (data.diag_log && data.diag_log !== lastLogMessage && data.diag_log !== "Start" && data.diag_log !== "") {
                                lastLogMessage = data.diag_log;
                                const time = new Date().toLocaleTimeString('cs-CZ');
                                const logDiv = document.createElement('div');
                                logDiv.innerHTML = `<span style="color:#888">[${time}]</span> ${data.diag_log}`;
                                diagTerminal.appendChild(logDiv);
                                diagTerminal.scrollTop = diagTerminal.scrollHeight;
                            }
                        } else {
                            diagStatus.textContent = JSON.stringify(data, null, 2);
                        }
                    }
                } else {
                    throw new Error('Chyba serveru');
                }
            } catch (error) {
                if (isConnected || statusText.textContent !== 'Odpojeno') {
                    isConnected = false;
                    statusText.textContent = 'Odpojeno';
                    statusBadge.classList.remove('connected');
                }
            }
        }

        // Automatický start dotazování po načtení stránky
        fetchState();
        setInterval(fetchState, 500);

        function toggleDevMode() {
            if (!devMode) {
                let pwd = prompt("Zadejte přístupový kód (Developer Mode):");
                if (pwd === "1234") {
                    devMode = true;
                    diagPanel.style.display = 'block';
                    devLink.textContent = 'Disable System Config';
                    devLink.style.color = 'var(--status-green)';
                    devLink.style.opacity = '1';
                    document.getElementById('moduleSelect').value = "0";
                    sendCommand('X1');
                } else if (pwd !== null) {
                    alert("Nesprávný přístupový kód.");
                }
            } else {
                devMode = false;
                diagPanel.style.display = 'none';
                devLink.textContent = 'System Config';
                devLink.style.color = 'var(--text-muted)';
                devLink.style.opacity = '0.3';
                sendCommand('X0');
            }
        }

        async function sendCommand(cmd) {
            const baseUrl = getBaseUrl();
            if (!baseUrl) {
                alert('Chybí IP adresa!');
                return;
            }
            try {
                const response = await fetch(`${baseUrl}/api/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: cmd
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP chyba! status: ${response.status}`);
                }
                console.log('Odesláno:', cmd);
            } catch (error) {
                console.error('Chyba při odesílání:', error);
                alert('Příkaz se nepodařilo odeslat. Zkontrolujte připojení.');
            }
        }
    </script>
</body>
</html>
